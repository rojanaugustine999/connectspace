# Keeps the free Render API awake.
# Render's free plan puts a service to sleep after 15 minutes without requests, and waking it takes
# about a minute. This job visits the health endpoint every 5 minutes so it never falls asleep.
# (Free for public repos. One always-on free Render service ≈ 720 h/month, within the 750 h allowance.)
#
# Note: GitHub can delay scheduled runs a little when it's busy, and it pauses schedules in repos
# with no commits for 60 days. You'd get an email; re-enable it under Actions → Keep API awake.
name: Keep API awake

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (GitHub's shortest interval)
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions: {} # this job needs no access to the repo

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Visit /api/health
        run: |
          curl --fail --silent --show-error \
               --max-time 120 --retry 2 --retry-delay 15 \
               --write-out "\nHTTP %{http_code} in %{time_total}s\n" \
               https://connectspace-api.onrender.com/api/health
